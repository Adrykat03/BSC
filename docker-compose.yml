version: '3.8'

services:
  # ============================================
  # MongoDB - Base de datos principal
  # ============================================
  bsc_mongo:
    image: mongo:7
    container_name: bsc_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - bsc_mongo_data:/data/db
      - ./seeds:/seeds:ro
    networks:
      bsc_net:
        ipv4_address: 19.168.78.10

  # ============================================
  # Backend API - .NET Core 8
  # ============================================
  bsc_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bsc_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      MongoDbSettings__ConnectionString: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@bsc_mongo:27017
      MongoDbSettings__DatabaseName: ${MONGO_DATABASE}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
    ports:
      - "5000:8080"
    volumes:
      - ./files:/app/files
    depends_on:
      - bsc_mongo
    networks:
      bsc_net:
        ipv4_address: 19.168.78.11

  # ============================================
  # Frontend - Nginx sirviendo build local de React
  # Compilar localmente: cd frontend && npm run build
  # El output (frontend/dist/) se monta como volumen en ./html
  # ============================================
  bsc_frontend:
    image: nginx:alpine
    container_name: bsc_frontend
    restart: unless-stopped
    ports:
      - "3030:3000"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bsc_backend
    networks:
      bsc_net:
        ipv4_address: 19.168.78.12

  # ============================================
  # SonarQube - Analisis de codigo
  # ============================================
  bsc_sonarqube:
    image: sonarqube:community
    container_name: bsc_sonarqube
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://bsc_sonardb:5432/${SONAR_DB_NAME}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    ports:
      - "9000:9000"
    volumes:
      - bsc_sonarqube_data:/opt/sonarqube/data
      - bsc_sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      - bsc_sonardb
    networks:
      bsc_net:
        ipv4_address: 19.168.78.13

  # ============================================
  # PostgreSQL - Base de datos SonarQube
  # ============================================
  bsc_sonardb:
    image: postgres:15-alpine
    container_name: bsc_sonardb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_DB_USER}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: ${SONAR_DB_NAME}
    volumes:
      - bsc_sonardb_data:/var/lib/postgresql/data
    networks:
      bsc_net:
        ipv4_address: 19.168.78.14

  # ============================================
  # Mongo Express - Admin UI para MongoDB
  # ============================================
  bsc_mongoexpress:
    image: mongo-express:latest
    container_name: bsc_mongoexpress
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@bsc_mongo:27017/
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_BASICAUTH_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - bsc_mongo
    networks:
      bsc_net:
        ipv4_address: 19.168.78.15

# ============================================
# Volumenes
# ============================================
volumes:
  bsc_mongo_data:
    driver: local
  bsc_sonarqube_data:
    driver: local
  bsc_sonarqube_extensions:
    driver: local
  bsc_sonardb_data:
    driver: local

# ============================================
# Red
# ============================================
networks:
  bsc_net:
    driver: bridge
    ipam:
      config:
        - subnet: 19.168.78.0/24
          gateway: 19.168.78.1
