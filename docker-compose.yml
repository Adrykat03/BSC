version: '3.8'

services:
  # ============================================
  # MongoDB - Base de datos principal
  # ============================================
  bsc_mongo:
    image: mongo:7
    container_name: bsc_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: bsc_admin
      MONGO_INITDB_ROOT_PASSWORD: bsc_pass_2024
      MONGO_INITDB_DATABASE: bsc_db
    ports:
      - "27017:27017"
    volumes:
      - bsc_mongo_data:/data/db
    networks:
      bsc_net:
        ipv4_address: 19.168.78.10

  # ============================================
  # Backend API - .NET Core 8
  # ============================================
  bsc_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bsc_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      MongoDbSettings__ConnectionString: mongodb://bsc_admin:bsc_pass_2024@bsc_mongo:27017
      MongoDbSettings__DatabaseName: bsc_db
    ports:
      - "5000:8080"
    depends_on:
      - bsc_mongo
    networks:
      bsc_net:
        ipv4_address: 19.168.78.11

  # ============================================
  # Frontend - Nginx sirviendo build local de React
  # Compilar localmente: cd frontend && npm run build
  # El output (frontend/dist/) se monta como volumen en ./html
  # ============================================
  bsc_frontend:
    image: nginx:alpine
    container_name: bsc_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bsc_backend
    networks:
      bsc_net:
        ipv4_address: 19.168.78.12

  # ============================================
  # SonarQube - Analisis de codigo
  # ============================================
  bsc_sonarqube:
    image: sonarqube:community
    container_name: bsc_sonarqube
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://bsc_sonardb:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube_pass
    ports:
      - "9000:9000"
    volumes:
      - bsc_sonarqube_data:/opt/sonarqube/data
      - bsc_sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      - bsc_sonardb
    networks:
      bsc_net:
        ipv4_address: 19.168.78.13

  # ============================================
  # PostgreSQL - Base de datos SonarQube
  # ============================================
  bsc_sonardb:
    image: postgres:15-alpine
    container_name: bsc_sonardb
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube_pass
      POSTGRES_DB: sonarqube
    ports:
      - "5432:5432"
    volumes:
      - bsc_sonardb_data:/var/lib/postgresql/data
    networks:
      bsc_net:
        ipv4_address: 19.168.78.14

  # ============================================
  # Mongo Express - Admin UI para MongoDB
  # ============================================
  bsc_mongoexpress:
    image: mongo-express:latest
    container_name: bsc_mongoexpress
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: bsc_admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: bsc_pass_2024
      ME_CONFIG_MONGODB_URL: mongodb://bsc_admin:bsc_pass_2024@bsc_mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8081:8081"
    depends_on:
      - bsc_mongo
    networks:
      bsc_net:
        ipv4_address: 19.168.78.15

# ============================================
# Volumenes
# ============================================
volumes:
  bsc_mongo_data:
    driver: local
  bsc_sonarqube_data:
    driver: local
  bsc_sonarqube_extensions:
    driver: local
  bsc_sonardb_data:
    driver: local

# ============================================
# Red
# ============================================
networks:
  bsc_net:
    driver: bridge
    ipam:
      config:
        - subnet: 19.168.78.0/24
          gateway: 19.168.78.1
