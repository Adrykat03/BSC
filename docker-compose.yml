version: '3.8'

services:
  # ============================================
  # MongoDB - Base de datos principal
  # ============================================
  bsc_mongo:
    image: mongo:7@sha256:43fddee7e532a920f3dfdee9e8f4834398c155c26bcb92d790cc1cd3c630fc40
    container_name: bsc_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - bsc_mongo_data:/data/db
      - ./seeds:/seeds:ro
    networks:
      bsc_net:
        ipv4_address: 19.168.78.10

  # ============================================
  # Backend API - .NET Core 8
  # ============================================
  bsc_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bsc_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      MongoDbSettings__ConnectionString: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@bsc_mongo:27017
      MongoDbSettings__DatabaseName: ${MONGO_DATABASE}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      UTILERIAS_API_BASE: ${UTILERIAS_API_BASE}
      UTILERIAS_TOKEN: ${UTILERIAS_TOKEN}
      DAB_BASE_URL: http://bsc_dab:5000
      TZ: America/Guayaquil
    ports:
      - "5000:8080"
    volumes:
      - ./files:/app/files
    depends_on:
      - bsc_mongo
      - bsc_dab
    networks:
      bsc_net:
        ipv4_address: 19.168.78.11

  # ============================================
  # Frontend - Nginx sirviendo build local de React
  # Compilar localmente: cd frontend && npm run build
  # El output (frontend/dist/) se monta como volumen en ./html
  # ============================================
  bsc_frontend:
    image: nginx:alpine@sha256:8aa63af009a39ecd6c28d61da578a5447378c10bb097a069e3a3e0fb42bb6b19
    container_name: bsc_frontend
    restart: unless-stopped
    ports:
      - "3030:3000"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bsc_backend
      - bsc_dab
      - bsc_fileserver
    networks:
      bsc_net:
        ipv4_address: 19.168.78.12

  # ============================================
  # Data API Builder - REST sobre SQL Server (Avisos.notificacionesConsolidadas)
  # ============================================
  # Lee la connection string desde dab/.env (variable SQL_CONN), no se commitea.
  # Ver dab/.env.example para el formato.
  bsc_dab:
    image: mcr.microsoft.com/azure-databases/data-api-builder:latest
    container_name: bsc_dab
    restart: unless-stopped
    env_file:
      - ./dab/.env
    volumes:
      - ./dab/dab-config.json:/App/dab-config.json:ro
    ports:
      - "5555:5000"
    networks:
      bsc_net:
        ipv4_address: 19.168.78.14

  # ============================================
  # File Server - Apache httpd sirviendo ./files
  # Usado por nginx (proxy /files/) para evidencias e insumos de tareas
  # ============================================
  bsc_fileserver:
    image: httpd:alpine@sha256:8f26f33a7002658050e9ab2cd6b77502619dfc89d0a6ba2e9e4a202e0ef04596
    container_name: bsc_fileserver
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./files:/usr/local/apache2/htdocs
    networks:
      bsc_net:
        ipv4_address: 19.168.78.13

  # ============================================
  # Mongo Express - Admin UI para MongoDB
  # ============================================
  bsc_mongoexpress:
    image: mongo-express:1.0.2-20@sha256:30fc6333779340217c6a2bc0bc3cd53aa46028ab8fc6caef41bd00bf0faacf53
    container_name: bsc_mongoexpress
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@bsc_mongo:27017/
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_BASICAUTH_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - bsc_mongo
    networks:
      bsc_net:
        ipv4_address: 19.168.78.15

# ============================================
# Volumenes
# ============================================
volumes:
  bsc_mongo_data:
    driver: local

# ============================================
# Red
# ============================================
networks:
  bsc_net:
    driver: bridge
    ipam:
      config:
        - subnet: 19.168.78.0/24
          gateway: 19.168.78.1
